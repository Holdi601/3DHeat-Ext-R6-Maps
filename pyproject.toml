[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "heat3d-ext-r6maps"
version = "0.1.0"
description = "Rainbow Six Siege maps from your own install into 3D levels for the 3DHeat viewer"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Holdi601" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
check = ["pyarrow>=15"]
test = ["pytest>=8.0"]

[project.scripts]
heat3d-r6-maps = "heat3d_ext_r6maps.cli:main"

[tool.setuptools]
packages = ["heat3d_ext_r6maps"]
