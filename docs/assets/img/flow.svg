<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 210" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14">
  <rect width="760" height="210" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>
  <g stroke="#555" stroke-width="1.5" fill="#f2f5fa">
    <rect x="10" y="20" width="160" height="70" rx="8"/>
